<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>M.IA — intro</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "MIA Serif";
        src: url("fonts/BodoniModa.ttf") format("truetype");
        font-weight: 400 900;
      }
      @font-face {
        font-family: "MIA Sans";
        src: url("fonts/Inter-Light.otf") format("opentype");
        font-weight: 300;
      }
      html, body { margin: 0; width: 100%; height: 100%; background: #FFFFFF; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #FFFFFF; }
      .clip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #stage { display: flex; flex-direction: column; align-items: center; }
      #word {
        font-family: "MIA Serif", serif;
        font-weight: 500;
        font-variation-settings: "opsz" 28;
        font-size: 270px;
        line-height: 1;
        letter-spacing: -0.01em;
        color: #000000;
        display: flex;
        align-items: baseline;
      }
      #word span { display: inline-block; }
      #sub .sc { display: inline-block; }
      #rule { width: 140px; height: 1px; transform-origin: 50% 50%; background: #000000; opacity: 0; margin: 46px 0 40px; }
      #sub {
        font-family: "MIA Sans", sans-serif;
        font-weight: 300;
        font-size: 28px;
        letter-spacing: 0.42em;
        padding-left: 0.42em;
        color: #000000;
        white-space: nowrap;
      }
      #sheen {
        position: absolute; top: 0; bottom: 0; left: 0; width: 520px; pointer-events: none;
        background: linear-gradient(105deg, rgba(247,246,243,0) 0%, rgba(255,255,255,0.6) 50%, rgba(247,246,243,0) 100%);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="9">
      <section id="intro" class="clip" data-start="0" data-duration="9">
        <div id="stage">
          <div id="word">
            <span class="ch">M</span><span class="ch" id="dot">.</span><span class="ch">I</span><span class="ch">A</span>
          </div>
          <div id="rule"></div>
          <div id="sub"><span class="sc">B</span><span class="sc">U</span><span class="sc">S</span><span class="sc">I</span><span class="sc">N</span><span class="sc">E</span><span class="sc">S</span><span class="sc">S</span><span class="sc">&nbsp;</span><span class="sc">D</span><span class="sc">E</span><span class="sc">V</span><span class="sc">E</span><span class="sc">L</span><span class="sc">O</span><span class="sc">P</span><span class="sc">M</span><span class="sc">E</span><span class="sc">N</span><span class="sc">T</span></div>
        </div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 1) Letras: suben suave, de desenfoque a nítido (sin prisa)
      tl.fromTo("#word .ch:not(#dot)",
        { opacity: 0, y: 34, filter: "blur(16px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.8, ease: "power3.out", stagger: 0.32 }, 0.6);

      // 2) El punto se asienta al final, como firma
      tl.fromTo("#dot",
        { opacity: 0, y: -40, scale: 0.6 },
        { opacity: 1, y: 0, scale: 1, duration: 1.2, ease: "back.out(1.6)" }, 2.1);

      // 3) Línea fina se abre desde el centro
      tl.fromTo("#rule",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 1.4, ease: "power2.inOut" }, 3.2);

      // 4) BUSINESS DEVELOPMENT: las letras llegan desde más abiertas y se asientan
      const sc = gsap.utils.toArray("#sub .sc");
      const mid = (sc.length - 1) / 2;
      tl.fromTo(sc,
        { opacity: 0, x: (i) => (i - mid) * 7, filter: "blur(6px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 2.0, ease: "power3.out" }, 3.6);

      // 6) Respiración muy leve durante todo el plano + reposo final
      tl.fromTo("#stage", { scale: 0.985 }, { scale: 1.0, duration: 9, ease: "none" }, 0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
